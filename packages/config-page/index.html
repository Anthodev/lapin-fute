<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; base-uri 'none'; form-action 'none'">
    <title>Lapin Futé</title>
    <link rel="stylesheet" href="./styles/config-page.css">
  </head>
  <body>
    <main>
      <h1 id="page-title">Lapin Futé</h1>

      <section aria-labelledby="key-title">
        <h2 id="key-title">API key</h2>
        <p class="status" id="key-status"></p>
        <label class="field-label" for="key-input" id="key-label"></label>
        <div class="key-row">
          <input id="key-input" type="password" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false">
          <button type="button" id="key-toggle" aria-pressed="false">Show</button>
        </div>
        <p class="error" id="key-error" role="alert" hidden></p>
        <p class="pending" id="key-pending" hidden></p>
        <button type="button" id="key-remove" class="danger" hidden>Remove key</button>
      </section>

      <section aria-labelledby="favorites-title">
        <h2 id="favorites-title">Favorites</h2>
        <p class="status" id="favorites-empty" hidden></p>
        <ul id="favorites-list"></ul>
      </section>

      <button type="button" id="save" class="primary">Save</button>
    </main>
    <noscript><p class="status">This page requires JavaScript.</p></noscript>
    <script type="module" src="./src/config-page.js"></script>
  </body>
</html>
