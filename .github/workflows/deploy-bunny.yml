name: Deploy configuration site to Bunny

on:
  push:
    tags: ["v*", "pre-v*"]
  workflow_dispatch:
    inputs:
      refresh_catalog:
        description: Rebuild and publish the IDFM catalog
        required: true
        default: false
        type: boolean
      force_catalog_upload:
        description: Upload a rebuilt catalog even when its IDFM source revision is already hosted
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-bunny-production
  # Never interrupt a production upload between its immutable files and the
  # manifest publication. A later deployment waits for the current one.
  cancel-in-progress: false

jobs:
  test:
    name: Run quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Validate release tag
        if: ${{ github.event_name == 'push' }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          production='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          preview='^pre-v(0|[1-9][0-9]*)-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          [[ "$RELEASE_TAG" =~ $production || "$RELEASE_TAG" =~ $preview ]]

      - run: npm test

  package:
    name: Build release PBW
    needs: test
    if: ${{ startsWith(github.ref_name, 'v') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - run: npm ci

      - name: Install pinned Pebble toolchain
        run: |
          uv tool install pebble-tool==5.0.40
          pebble sdk install 4.33.1

      - name: Validate package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./packages/watch/package.json').version")"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"

      - name: Build production PBW
        env:
          LAPIN_FUTE_CONFIG_URL: ${{ vars.CONFIG_SITE_ORIGIN }}
        run: npm run build

      - name: Prepare release artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir release-assets
          cp packages/watch/build/watch.pbw "release-assets/lapin-fute-$RELEASE_TAG.pbw"
          (
            cd release-assets
            sha256sum "lapin-fute-$RELEASE_TAG.pbw" > SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: lapin-fute-${{ github.ref_name }}
          path: release-assets/
          if-no-files-found: error

  deploy:
    name: Build and deploy configuration site
    needs: test
    if: ${{ startsWith(github.ref_name, 'v') || (github.event_name == 'workflow_dispatch' && inputs.refresh_catalog) }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Refresh production catalog
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_catalog }}
        env:
          IDFM_DATASET_TOKEN: ${{ secrets.IDFM_DATASET_TOKEN }}
        run: npm run catalog:refresh

      - name: Plan catalog upload
        id: catalog
        env:
          CONFIG_SITE_ORIGIN: ${{ vars.CONFIG_SITE_ORIGIN }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_CATALOG_UPLOAD: ${{ inputs.force_catalog_upload }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != workflow_dispatch ]]; then
            include_catalog=false
            reason="release tags update the configuration page only"
          elif [[ "$FORCE_CATALOG_UPLOAD" = true ]]; then
            include_catalog=true
            reason="catalog upload was forced"
          else
            include_catalog="$(node scripts/plan-catalog-upload.mjs)"
            reason="catalog source-revision comparison completed"
          fi
          echo "include_catalog=$include_catalog" >> "$GITHUB_OUTPUT"
          echo "$reason: include_catalog=$include_catalog"

      - name: Build static configuration site
        env:
          INCLUDE_CATALOG: ${{ steps.catalog.outputs.include_catalog }}
        run: |
          if [[ "$INCLUDE_CATALOG" = true ]]; then
            npm run build:config-site
          else
            npm run build:config-page
          fi

      - name: Back up mutable production files
        id: backup
        shell: bash
        env:
          BUNNY_STORAGE_ENDPOINT: ${{ vars.BUNNY_STORAGE_ENDPOINT }}
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$BUNNY_STORAGE_ENDPOINT"
          test -n "$BUNNY_STORAGE_PASSWORD"
          endpoint="${BUNNY_STORAGE_ENDPOINT%/}"
          case "$endpoint" in
            https://*) ;;
            *) echo "BUNNY_STORAGE_ENDPOINT must use HTTPS" >&2; exit 1 ;;
          esac
          mkdir -p var/deploy-backup/files
          : > var/deploy-backup/missing

          while IFS= read -r -d '' file; do
            relative_path="${file#var/config-site/}"
            if [[ "$relative_path" =~ ^catalog/[a-f0-9]{64}/ ]]; then
              continue
            fi
            case "$relative_path" in
              *[!A-Za-z0-9._/-]* | /* | *../*)
                echo "Refusing unsafe backup path: $relative_path" >&2
                exit 1
                ;;
            esac

            target="var/deploy-backup/files/$relative_path"
            mkdir -p "$(dirname "$target")"
            status="$(curl --silent --show-error \
              --output "$target" \
              --write-out '%{http_code}' \
              --header "AccessKey: $BUNNY_STORAGE_PASSWORD" \
              "$endpoint/$relative_path")"
            case "$status" in
              200) ;;
              404)
                rm -f "$target"
                printf '%s\0' "$relative_path" >> var/deploy-backup/missing
                ;;
              *)
                echo "Could not back up $relative_path: HTTP $status" >&2
                exit 1
                ;;
            esac
          done < <(find var/config-site -type f -print0)

      - name: Retain rollback bundle
        uses: actions/upload-artifact@v4
        with:
          name: bunny-rollback-${{ github.run_id }}
          path: var/deploy-backup/
          if-no-files-found: error
          retention-days: 30

      - name: Upload static site to Bunny Storage
        id: upload
        shell: bash
        env:
          BUNNY_STORAGE_ENDPOINT: ${{ vars.BUNNY_STORAGE_ENDPOINT }}
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$BUNNY_STORAGE_ENDPOINT"
          test -n "$BUNNY_STORAGE_PASSWORD"
          endpoint="${BUNNY_STORAGE_ENDPOINT%/}"
          case "$endpoint" in
            https://*) ;;
            *) echo "BUNNY_STORAGE_ENDPOINT must use HTTPS" >&2; exit 1 ;;
          esac

          upload_file() {
            local file="$1"
            local relative_path="${file#var/config-site/}"
            local mime_type
            case "$relative_path" in
              *[!A-Za-z0-9._/-]* | /* | *../*)
                echo "Refusing unsafe deployment path: $relative_path" >&2
                exit 1
                ;;
            esac
            mime_type="$(file --brief --mime-type "$file")"
            echo "Uploading $relative_path"
            curl --fail --silent --show-error \
              --retry 3 --retry-all-errors \
              --request PUT \
              --header "AccessKey: $BUNNY_STORAGE_PASSWORD" \
              --header "Content-Type: $mime_type" \
              --upload-file "$file" \
              "$endpoint/$relative_path"
          }

          export endpoint BUNNY_STORAGE_PASSWORD
          export -f upload_file
          find var/config-site -type f ! -path 'var/config-site/catalog/manifest.json' -print0 \
            | xargs -0 --no-run-if-empty --max-args=1 --max-procs=32 \
                bash -c 'upload_file "$1"' _

          # Publish the catalog pointer only after every immutable catalog file.
          if [[ -f var/config-site/catalog/manifest.json ]]; then
            upload_file var/config-site/catalog/manifest.json
          fi

      - name: Purge Bunny CDN cache
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNY_PULL_ZONE_ID: ${{ vars.BUNNY_PULL_ZONE_ID }}
        run: |
          set -euo pipefail
          test -n "$BUNNY_API_KEY"
          test -n "$BUNNY_PULL_ZONE_ID"
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors \
            --request POST \
            --header "AccessKey: $BUNNY_API_KEY" \
            "https://api.bunny.net/pullzone/$BUNNY_PULL_ZONE_ID/purgeCache"

      - name: Verify served static site
        env:
          CONFIG_SITE_ORIGIN: ${{ vars.CONFIG_SITE_ORIGIN }}
          INCLUDE_CATALOG: ${{ steps.catalog.outputs.include_catalog }}
        run: |
          for attempt in 1 2 3; do
            if [[ "$INCLUDE_CATALOG" = true ]]; then
              command=(npm run verify:config-site)
            else
              command=(npm run verify:config-site -- --page-only)
            fi
            if "${command[@]}"; then
              exit 0
            fi
            if [[ "$attempt" != 3 ]]; then sleep 10; fi
          done
          exit 1

      - name: Restore previous mutable files after failure
        if: ${{ failure() && steps.backup.outcome == 'success' }}
        shell: bash
        env:
          BUNNY_STORAGE_ENDPOINT: ${{ vars.BUNNY_STORAGE_ENDPOINT }}
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNY_PULL_ZONE_ID: ${{ vars.BUNNY_PULL_ZONE_ID }}
        run: |
          set -euo pipefail

          endpoint="${BUNNY_STORAGE_ENDPOINT%/}"
          case "$endpoint" in
            https://*) ;;
            *) echo "BUNNY_STORAGE_ENDPOINT must use HTTPS" >&2; exit 1 ;;
          esac
          restore_file() {
            local file="$1"
            local relative_path="${file#var/deploy-backup/files/}"
            local mime_type
            mime_type="$(file --brief --mime-type "$file")"
            echo "Restoring $relative_path"
            curl --fail --silent --show-error \
              --request PUT \
              --header "AccessKey: $BUNNY_STORAGE_PASSWORD" \
              --header "Content-Type: $mime_type" \
              --upload-file "$file" \
              "$endpoint/$relative_path"
          }
          export endpoint BUNNY_STORAGE_PASSWORD
          export -f restore_file
          find var/deploy-backup/files -type f -print0 \
            | xargs -0 --no-run-if-empty --max-args=1 --max-procs=16 \
                bash -c 'restore_file "$1"' _

          while IFS= read -r -d '' relative_path; do
            echo "Removing newly introduced mutable file $relative_path"
            status="$(curl --silent --show-error \
              --request DELETE \
              --header "AccessKey: $BUNNY_STORAGE_PASSWORD" \
              --output /dev/null \
              --write-out '%{http_code}' \
              "$endpoint/$relative_path")"
            case "$status" in
              200 | 201 | 204 | 404) ;;
              *)
                echo "Could not remove $relative_path during rollback: HTTP $status" >&2
                exit 1
                ;;
            esac
          done < var/deploy-backup/missing

          curl --fail --silent --show-error \
            --request POST \
            --header "AccessKey: $BUNNY_API_KEY" \
            "https://api.bunny.net/pullzone/$BUNNY_PULL_ZONE_ID/purgeCache"

  publish:
    name: Publish GitHub release notes
    needs: [test, package, deploy]
    if: ${{ startsWith(github.ref_name, 'v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: lapin-fute-${{ github.ref_name }}
          path: release-assets

      - name: Generate categorized release notes
        shell: bash
        run: |
          set -euo pipefail
          previous_tag="$(git describe --tags --match 'v[0-9]*' --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)"

          if [[ -n "$previous_tag" ]]; then
            range="$previous_tag..$GITHUB_SHA"
            changelog_url="https://github.com/$GITHUB_REPOSITORY/compare/$previous_tag...$GITHUB_REF_NAME"
          else
            range="$GITHUB_SHA"
            changelog_url="https://github.com/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME"
          fi

          RANGE="$range" CHANGELOG_URL="$changelog_url" node --input-type=module <<'EOF'
          import { execFileSync } from "node:child_process";
          import { writeFileSync } from "node:fs";

          const groups = [
            { key: "feat", title: "Features", commits: [] },
            { key: "change", title: "Changes", commits: [] },
            { key: "fix", title: "Fixes", commits: [] },
            { key: "ci", title: "CI", commits: [] },
          ];
          const byKey = new Map(groups.map((group) => [group.key, group]));
          const fields = execFileSync(
            "git",
            ["log", "--first-parent", "-z", "--format=%s%x00%h", process.env.RANGE],
            { encoding: "utf8" },
          ).split("\0").filter(Boolean);

          for (let index = 0; index < fields.length; index += 2) {
            const subject = fields[index].trim();
            const hash = fields[index + 1].trim();
            const type = subject.match(/^([a-z]+)(?:\([^)]*\))?!?:\s+/i)?.[1].toLowerCase();
            const key = type === "feat"
              ? "feat"
              : type === "fix"
                ? "fix"
                : type === "ci"
                  ? "ci"
                  : "change";

            byKey.get(key).commits.push(`- ${subject} (\`${hash}\`)`);
          }

          const notes = [];
          for (const group of groups) {
            if (group.commits.length === 0) continue;
            notes.push(`## ${group.title}`, "", ...group.commits, "");
          }
          notes.push(`**Full changelog**: ${process.env.CHANGELOG_URL}`, "");
          writeFileSync("release-notes.md", notes.join("\n"));
          EOF

      - name: Create release with categorized notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            release-assets/*

  store:
    name: Publish release to the RePebble store
    needs: publish
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    environment: pebble-store
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: lapin-fute-${{ github.ref_name }}
          path: release-assets

      - name: Fetch published release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body \
            > "$RUNNER_TEMP/store-release-notes.md"

      - name: Publish to the RePebble store
        env:
          PEBBLE_FIREBASE_REFRESH_TOKEN: ${{ secrets.PEBBLE_FIREBASE_REFRESH_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-pebble-store.mjs \
            --pbw "release-assets/lapin-fute-$RELEASE_TAG.pbw" \
            --checksums "release-assets/SHA256SUMS" \
            --tag "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/store-release-notes.md"
